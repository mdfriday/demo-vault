<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <title>404 | {{ .Site.Title }}</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family:sans-serif; }
    .not-found { text-align:center; }
    h1 { font-size:8rem; opacity:0.2; margin:0; }
  </style>
</head>
<body>
  <div class="not-found base-404">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <a href="{{ .Site.Home.RelPermalink }}">&#8592; {{ .Site.Title }}</a>
  </div>
</body>
</html>

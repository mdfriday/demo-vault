{{ define "main" }}
<section class="list base-list">
  <h1 class="list-title">{{ .Title }}</h1>
  {{ $pag := .Paginate .Pages }}
  <ul class="page-list">
    {{ range $pag.Pages }}
    <li class="page-item">
      {{- partial "post-card.html" . -}}
    </li>
    {{ end }}
  </ul>
  {{- partial "pagination.html" . -}}
</section>
{{ end }}

{{- /* [CAP:disqus] → see caps/disqus/manifest.json */ -}}
{{- if .Site.IsDisqusEnabled -}}
{{ if .Site.DisqusShortname }}
<div id="disqus_thread"></div><!-- LOCKED: #disqus_thread (Disqus embed.js依赖) -->
<script>
  window.disqus_config = function () {
    {{with .Params.disqus_identifier }}this.page.identifier = '{{ . }}';{{end}}
    {{with .Params.disqus_title }}this.page.title = '{{ . }}';{{end}}
  };
  (function() {
    if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) {
      document.getElementById('disqus_thread').innerHTML = 'Disqus not available in local preview.';
      return;
    }
    var d = document, s = d.createElement('script'); s.async = true;
    s.src = '//' + '{{ .Site.DisqusShortname }}' + '.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  })();
</script>
{{ end }}
{{- end -}}

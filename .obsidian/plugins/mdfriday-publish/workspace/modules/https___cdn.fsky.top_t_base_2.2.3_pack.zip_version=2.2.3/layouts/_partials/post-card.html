{{- /* [CAP:post-card] → see caps/post-card/manifest.json */ -}}
<article class="post-card">
  <h2 class="post-card-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>
  {{- with .Date -}}
  <time class="post-card-date" datetime="{{ . }}">{{ . | time.Format "2006-01-02" }}</time>
  {{- end -}}
  {{- with .Description -}}
  <p class="post-card-summary">{{ . }}</p>
  {{- end -}}
</article>

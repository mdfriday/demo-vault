{{- /* [CAP:bilibili] → see caps/bilibili/manifest.json */ -}}
{{- $id := .Get "id" | default (.Get 0) -}}
<div class="mdf-video-wrapper bilibili-wrapper" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;">
  <iframe
    src="https://player.bilibili.com/player.html?bvid={{ $id }}&page=1"
    title="{{ .Get "title" | default "Bilibili Video" }}"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
    scrolling="no"
    allowfullscreen
    loading="lazy">
  </iframe>
</div>
